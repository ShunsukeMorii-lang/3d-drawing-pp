<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D鋼材寸法シミュレーター（L字 / コの字）</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #ui-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.95);
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      width: 240px;
      z-index: 10;
      touch-action: auto;
    }
    .shape-selector {
      display: flex;
      justify-content: space-around;
      margin-bottom: 12px;
      background: #eee;
      padding: 4px;
      border-radius: 6px;
    }
    .shape-selector label {
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 4px;
    }
    .shape-selector input {
      display: none;
    }
    .shape-selector input:checked + span {
      background: #1e88e5;
      color: white;
      border-radius: 4px;
      padding: 6px 12px;
    }
    .input-group {
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .input-group label {
      font-weight: bold;
      font-size: 14px;
    }
    .input-group input {
      width: 100px;
      padding: 6px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .note {
      font-size: 11px;
      color: #666;
      margin-top: 8px;
      line-height: 1.3;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="ui-panel">
  <h3 style="margin-top:0; margin-bottom:10px;">3D図面シミュレーター</h3>
  
  <div class="shape-selector">
    <label>
      <input type="radio" name="shapeType" value="L" checked id="typeL">
      <span>L字</span>
    </label>
    <label>
      <input type="radio" name="shapeType" value="U" id="typeU">
      <span>コの字</span>
    </label>
  </div>

  <div class="input-group">
    <label for="inputA" id="labelA">A (縦mm):</label>
    <input type="number" id="inputA" value="100" min="1" step="1" inputmode="decimal">
  </div>
  <div class="input-group">
    <label for="inputB" id="labelB">B (横mm):</label>
    <input type="number" id="inputB" value="100" min="1" step="1" inputmode="decimal">
  </div>
  <div class="input-group" id="groupC">
    <label for="inputC" id="labelC">C (奥行mm):</label>
    <input type="number" id="inputC" value="200" min="1" step="1" inputmode="decimal">
  </div>
  <div class="input-group" id="groupD" style="display: none;">
    <label for="inputD" id="labelD">D (奥行mm):</label>
    <input type="number" id="inputD" value="200" min="1" step="1" inputmode="decimal">
  </div>
  <div class="input-group">
    <label for="inputT">t (板厚mm):</label>
    <input type="number" id="inputT" value="3" min="0.1" step="0.1" inputmode="decimal">
  </div>

  <div class="note">
    ※ 1本指ドラッグ: 360度全方向回転<br>
    ※ 2本指ピンチ: 拡大・縮小
  </div>
</div>

<script>
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x222222);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 10000);
  camera.position.set(0, 0, 500);

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // ライティング
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambientLight);

  const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
  dirLight1.position.set(200, 300, 200);
  scene.add(dirLight1);

  const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
  dirLight2.position.set(-200, -100, -200);
  scene.add(dirLight2);

  // 回転専用の親グループ（全方向フリースピン対応）
  const rotateGroup = new THREE.Group();
  scene.add(rotateGroup);

  let shapeGroup = new THREE.Group();
  rotateGroup.add(shapeGroup);

  const blueMaterial = new THREE.MeshStandardMaterial({
    color: 0x1e88e5,
    roughness: 0.3,
    metalness: 0.1
  });

  const whiteMaterial = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 0.3,
    metalness: 0.1
  });

  const materials = [whiteMaterial, blueMaterial];

  // -------------------------------------------------------------
  // ★ iPhone/iOS向け 安定動作タッチ・マウス操作ロジック
  // -------------------------------------------------------------
  let isPointerDown = false;
  let previousTouchPosition = { x: 0, y: 0 };
  let initialPinchDistance = null;
  let initialCameraZ = 500;

  const dom = renderer.domElement;

  function getTouchDist(e) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  // ポインター押下
  function onPointerStart(e) {
    if (e.target.closest('#ui-panel')) return; // UI操作時はカメラ動かさない
    isPointerDown = true;

    if (e.touches && e.touches.length === 1) {
      previousTouchPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    } else if (e.touches && e.touches.length === 2) {
      initialPinchDistance = getTouchDist(e);
      initialCameraZ = camera.position.z;
    } else if (!e.touches) {
      previousTouchPosition = { x: e.clientX, y: e.clientY };
    }
  }

  // ポインター移動（全方向360度回転）
  function onPointerMove(e) {
    if (!isPointerDown) return;
    if (e.target.closest('#ui-panel')) return;

    if (e.touches && e.touches.length === 1) {
      const deltaX = e.touches[0].clientX - previousTouchPosition.x;
      const deltaY = e.touches[0].clientY - previousTouchPosition.y;

      // クォータニオンによる全方向360度スムーズ回転
      const deltaRotationQuaternion = new THREE.Quaternion()
        .setFromEuler(new THREE.Euler(
          deltaY * 0.008,
          deltaX * 0.008,
          0,
          'XYZ'
        ));

      rotateGroup.quaternion.multiplyQuaternions(deltaRotationQuaternion, rotateGroup.quaternion);
      previousTouchPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };

    } else if (e.touches && e.touches.length === 2 && initialPinchDistance) {
      // 2本指ピンチイン・アウト（拡大縮小）
      const currentDist = getTouchDist(e);
      const factor = initialPinchDistance / currentDist;
      camera.position.z = Math.max(100, Math.min(2000, initialCameraZ * factor));

    } else if (!e.touches) {
      // マウス操作
      const deltaX = e.clientX - previousTouchPosition.x;
      const deltaY = e.clientY - previousTouchPosition.y;

      const deltaRotationQuaternion = new THREE.Quaternion()
        .setFromEuler(new THREE.Euler(
          deltaY * 0.008,
          deltaX * 0.008,
          0,
          'XYZ'
        ));

      rotateGroup.quaternion.multiplyQuaternions(deltaRotationQuaternion, rotateGroup.quaternion);
      previousTouchPosition = { x: e.clientX, y: e.clientY };
    }
  }

  function onPointerEnd() {
    isPointerDown = false;
    initialPinchDistance = null;
  }

  // ホイール拡大縮小（PC用）
  window.addEventListener('wheel', (e) => {
    if (e.target.closest('#ui-panel')) return;
    camera.position.z = Math.max(100, Math.min(2000, camera.position.z + e.deltaY * 0.5));
  }, { passive: true });

  // タッチイベント登録
  dom.addEventListener('touchstart', onPointerStart, { passive: true });
  dom.addEventListener('touchmove', onPointerMove, { passive: true });
  dom.addEventListener('touchend', onPointerEnd, { passive: true });
  dom.addEventListener('touchcancel', onPointerEnd, { passive: true });

  // マウスイベント登録
  dom.addEventListener('mousedown', onPointerStart);
  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerEnd);

  // -------------------------------------------------------------
  // 3Dモデル生成処理
  // -------------------------------------------------------------
  function getValidValue(id, defaultValue) {
    const el = document.getElementById(id);
    if (!el) return defaultValue;
    const val = parseFloat(el.value);
    return (isNaN(val) || val <= 0) ? defaultValue : val;
  }

  function clearGroup(group) {
    while (group.children.length > 0) {
      const obj = group.children[0];
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        if (Array.isArray(obj.material)) {
          obj.material.forEach(m => m.dispose());
        } else {
          obj.material.dispose();
        }
      }
      group.remove(obj);
    }
  }

  function buildModel() {
    clearGroup(shapeGroup);

    const isL = document.getElementById('typeL').checked;
    const shape = new THREE.Shape();
    let depth = 200;
    let innerEdges = [];

    if (isL) {
      let A = getValidValue('inputA', 100);
      let B = getValidValue('inputB', 100);
      let C = getValidValue('inputC', 200);
      let t = getValidValue('inputT', 3);

      if (t >= A) t = A - 1;
      if (t >= B) t = B - 1;
      depth = C;

      shape.moveTo(0, 0);
      shape.lineTo(B, 0);
      shape.lineTo(B, t);
      shape.lineTo(t, t);
      shape.lineTo(t, A);
      shape.lineTo(0, A);
      shape.closePath();

      const innerX = t - (B / 2);
      const innerY = t - (A / 2);
      innerEdges.push({ x: innerX, y: innerY });

    } else {
      let A = getValidValue('inputA', 100);
      let B = getValidValue('inputB', 100);
      let C = getValidValue('inputC', 200);
      let D = getValidValue('inputD', 200);
      let t = getValidValue('inputT', 3);

      if (t >= A) t = A - 1;
      if (t >= B) t = B - 1;
      if (t * 2 >= C) t = (C / 2) - 1;
      depth = D;

      shape.moveTo(0, 0);
      shape.lineTo(C, 0);
      shape.lineTo(C, B);
      shape.lineTo(C - t, B);
      shape.lineTo(C - t, t);
      shape.lineTo(t, t);
      shape.lineTo(t, A);
      shape.lineTo(0, A);
      shape.closePath();

      const leftInnerX = t - (C / 2);
      const leftInnerY = t - (Math.max(A, B) / 2);
      const rightInnerX = (C - t) - (C / 2);
      const rightInnerY = t - (Math.max(A, B) / 2);

      innerEdges.push({ x: leftInnerX, y: leftInnerY });
      innerEdges.push({ x: rightInnerX, y: rightInnerY });
    }

    const geometry = new THREE.ExtrudeGeometry(shape, {
      depth: depth,
      bevelEnabled: false
    });
    geometry.center();

    const mesh = new THREE.Mesh(geometry, materials);
    shapeGroup.add(mesh);

    const halfDepth = depth / 2;
    const lineMaterial = new THREE.LineDashedMaterial({
      color: 0xffeb3b,
      dashSize: 5,
      gapSize: 3,
      depthTest: false,
      transparent: true,
      opacity: 0.8
    });

    innerEdges.forEach(edge => {
      const points = [
        new THREE.Vector3(edge.x, edge.y, -halfDepth),
        new THREE.Vector3(edge.x, edge.y, halfDepth)
      ];
      const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
      const innerLine = new THREE.LineSegments(lineGeo, lineMaterial);
      innerLine.computeLineDistances();
      shapeGroup.add(innerLine);
    });
  }

  function updateUI() {
    const isL = document.getElementById('typeL').checked;
    
    if (isL) {
      document.getElementById('labelA').innerText = "A (縦mm):";
      document.getElementById('labelB').innerText = "B (横mm):";
      document.getElementById('groupC').style.display = "flex";
      document.getElementById('labelC').innerText = "C (奥行mm):";
      document.getElementById('groupD').style.display = "none";
    } else {
      document.getElementById('labelA').innerText = "A (左縦mm):";
      document.getElementById('labelB').innerText = "B (右縦mm):";
      document.getElementById('groupC').style.display = "flex";
      document.getElementById('labelC').innerText = "C (底辺mm):";
      document.getElementById('groupD').style.display = "flex";
      document.getElementById('labelD').innerText = "D (奥行mm):";
    }

    buildModel();
  }

  let timer = null;
  function onInputHandler() {
    clearTimeout(timer);
    timer = setTimeout(() => {
      buildModel();
    }, 100);
  }

  document.getElementById('typeL').addEventListener('change', updateUI);
  document.getElementById('typeU').addEventListener('change', updateUI);
  
  ['inputA', 'inputB', 'inputC', 'inputD', 'inputT'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', onInputHandler);
  });

  updateUI();

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>

</body>
</html>
