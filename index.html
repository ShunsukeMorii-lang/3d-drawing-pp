<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>3D鋼材寸法シミュレーター（L字 / コの字）</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    #ui-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.95);
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      width: 240px;
      z-index: 10;
    }
    .shape-selector {
      display: flex;
      justify-content: space-around;
      margin-bottom: 12px;
      background: #eee;
      padding: 4px;
      border-radius: 6px;
    }
    .shape-selector label {
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      padding: 4px 12px;
      border-radius: 4px;
    }
    .shape-selector input {
      display: none;
    }
    .shape-selector input:checked + span {
      background: #1e88e5;
      color: white;
      border-radius: 4px;
      padding: 4px 12px;
    }
    .input-group {
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .input-group label {
      font-weight: bold;
      font-size: 14px;
    }
    .input-group input {
      width: 100px;
      padding: 5px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .note {
      font-size: 11px;
      color: #666;
      margin-top: 8px;
      line-height: 1.3;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="ui-panel">
  <h3 style="margin-top:0; margin-bottom:10px;">3D図面シミュレーター</h3>
  
  <!-- 形状選択タブ -->
  <div class="shape-selector">
    <label>
      <input type="radio" name="shapeType" value="L" checked id="typeL">
      <span>L字</span>
    </label>
    <label>
      <input type="radio" name="shapeType" value="U" id="typeU">
      <span>コの字</span>
    </label>
  </div>

  <!-- 寸法入力フォーム -->
  <div class="input-group">
    <label for="inputA" id="labelA">A (縦mm):</label>
    <input type="number" id="inputA" value="100" min="1" step="1">
  </div>
  <div class="input-group">
    <label for="inputB" id="labelB">B (横mm):</label>
    <input type="number" id="inputB" value="100" min="1" step="1">
  </div>
  <div class="input-group" id="groupC">
    <label for="inputC" id="labelC">C (奥行mm):</label>
    <input type="number" id="inputC" value="200" min="1" step="1">
  </div>
  <div class="input-group" id="groupD" style="display: none;">
    <label for="inputD" id="labelD">D (奥行mm):</label>
    <input type="number" id="inputD" value="200" min="1" step="1">
  </div>
  <div class="input-group">
    <label for="inputT">t (板厚mm):</label>
    <input type="number" id="inputT" value="3" min="0.1" step="0.1">
  </div>

  <div class="note">
    ※ ドラッグで360度回転<br>
    ※ ホイールで拡大・縮小
  </div>
</div>

<script>
  // 1. シーン・カメラ・レンダラーの準備
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x222222);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 10000);
  camera.position.set(250, 250, 400);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // ライティング
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambientLight);

  const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
  dirLight1.position.set(200, 300, 200);
  scene.add(dirLight1);

  const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
  dirLight2.position.set(-200, -100, -200);
  scene.add(dirLight2);

  let shapeGroup = new THREE.Group();
  scene.add(shapeGroup);

  // 共通マテリアル設定（正面・背面＝青色、側面＝白色）
  const blueMaterial = new THREE.MeshStandardMaterial({
    color: 0x1e88e5,
    roughness: 0.3,
    metalness: 0.1
  });

  const whiteMaterial = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 0.3,
    metalness: 0.1
  });

  const materials = [whiteMaterial, blueMaterial];

  // 2. 3Dモデル生成メイン処理
  function buildModel() {
    // 既存オブジェクトのクリア
    while(shapeGroup.children.length > 0){ 
      const obj = shapeGroup.children[0];
      obj.geometry.dispose();
      shapeGroup.remove(obj); 
    }

    const isL = document.getElementById('typeL').checked;
    const shape = new THREE.Shape();
    let depth = 200;
    let innerEdges = [];

    if (isL) {
      // --- L字形状の定義 ---
      let A = parseFloat(document.getElementById('inputA').value) || 10;
      let B = parseFloat(document.getElementById('inputB').value) || 10;
      let C = parseFloat(document.getElementById('inputC').value) || 10;
      let t = parseFloat(document.getElementById('inputT').value) || 1;

      if (t >= A) t = A - 1;
      if (t >= B) t = B - 1;
      depth = C;

      shape.moveTo(0, 0);
      shape.lineTo(B, 0);
      shape.lineTo(B, t);
      shape.lineTo(t, t);  // 内角
      shape.lineTo(t, A);
      shape.lineTo(0, A);
      shape.closePath();

      // 内角隠れ線（1本）
      const innerX = t - (B / 2);
      const innerY = t - (A / 2);
      innerEdges.push({ x: innerX, y: innerY });

    } else {
      // --- コの字形状の定義 ---
      let A = parseFloat(document.getElementById('inputA').value) || 10; // 左縦
      let B = parseFloat(document.getElementById('inputB').value) || 10; // 右縦
      let C = parseFloat(document.getElementById('inputC').value) || 10; // 底辺横
      let D = parseFloat(document.getElementById('inputD').value) || 10; // 奥行
      let t = parseFloat(document.getElementById('inputT').value) || 1;

      if (t >= A) t = A - 1;
      if (t >= B) t = B - 1;
      if (t * 2 >= C) t = (C / 2) - 1;
      depth = D;

      shape.moveTo(0, 0);
      shape.lineTo(C, 0);
      shape.lineTo(C, B);
      shape.lineTo(C - t, B);
      shape.lineTo(C - t, t); // 右内角
      shape.lineTo(t, t);     // 左内角
      shape.lineTo(t, A);
      shape.lineTo(0, A);
      shape.closePath();

      // 内角隠れ線（左と右の2本）
      const leftInnerX = t - (C / 2);
      const leftInnerY = t - (Math.max(A, B) / 2);
      const rightInnerX = (C - t) - (C / 2);
      const rightInnerY = t - (Math.max(A, B) / 2);

      innerEdges.push({ x: leftInnerX, y: leftInnerY });
      innerEdges.push({ x: rightInnerX, y: rightInnerY });
    }

    // 3D押し出し
    const geometry = new THREE.ExtrudeGeometry(shape, {
      depth: depth,
      bevelEnabled: false
    });
    geometry.center();

    const mesh = new THREE.Mesh(geometry, materials);
    shapeGroup.add(mesh);

    // --- 内角エッジライン（透過点線）の描画 ---
    const halfDepth = depth / 2;
    const lineMaterial = new THREE.LineDashedMaterial({
      color: 0xffeb3b,    // 黄色の点線
      dashSize: 5,
      gapSize: 3,
      depthTest: false,   // 背面時も透過
      transparent: true,
      opacity: 0.8
    });

    innerEdges.forEach(edge => {
      const points = [
        new THREE.Vector3(edge.x, edge.y, -halfDepth),
        new THREE.Vector3(edge.x, edge.y, halfDepth)
      ];
      const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
      const innerLine = new THREE.LineSegments(lineGeo, lineMaterial);
      innerLine.computeLineDistances();
      shapeGroup.add(innerLine);
    });
  }

  // 3. UIの切り替え制御
  function updateUI() {
    const isL = document.getElementById('typeL').checked;
    
    if (isL) {
      document.getElementById('labelA').innerText = "A (縦mm):";
      document.getElementById('labelB').innerText = "B (横mm):";
      document.getElementById('groupC').style.display = "flex";
      document.getElementById('labelC').innerText = "C (奥行mm):";
      document.getElementById('groupD').style.display = "none";
    } else {
      document.getElementById('labelA').innerText = "A (左縦mm):";
      document.getElementById('labelB').innerText = "B (右縦mm):";
      document.getElementById('groupC').style.display = "flex";
      document.getElementById('labelC').innerText = "C (底辺mm):";
      document.getElementById('groupD').style.display = "flex";
      document.getElementById('labelD').innerText = "D (奥行mm):";
    }

    buildModel();
  }

  // イベントリスナー登録
  document.getElementById('typeL').addEventListener('change', updateUI);
  document.getElementById('typeU').addEventListener('change', updateUI);
  
  document.getElementById('inputA').addEventListener('input', buildModel);
  document.getElementById('inputB').addEventListener('input', buildModel);
  document.getElementById('inputC').addEventListener('input', buildModel);
  document.getElementById('inputD').addEventListener('input', buildModel);
  document.getElementById('inputT').addEventListener('input', buildModel);

  // 初期描画
  updateUI();

  // 4. アニメーションループ
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>

</body>
</html>
